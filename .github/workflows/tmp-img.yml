name: Tillfällig bildkopia
on:
  push:
    branches: [tmp-img]
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - uses: actions/cache@v4
        with: { path: nasa-src, key: nasa-src-v1 }
      - run: python tools/fetch_nasa.py nasa-src
      - run: |
          python tools/prepare_images.py nasa-src img-out
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git rm -q --cached .github/workflows/tmp-img.yml
          git add -f img-out && git commit -qm "bilder" && git push origin HEAD:tmp-img-out
